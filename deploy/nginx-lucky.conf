# Lucky 生产 nginx 配置（deploy 分支）
# 安装：sudo cp deploy/nginx-lucky.conf /etc/nginx/sites-available/lucky
#       sudo ln -s /etc/nginx/sites-available/lucky /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80;
    server_name _;          # IP 直访；有域名后改为域名并在此前配置备案

    # 前端静态文件（deploy 分支内置预构建产物 frontend/dist）
    root /opt/lucky/frontend/dist;
    index index.html;

    # SPA 路由兜底
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反代（SSE 流式必须关闭缓冲）
    location /api/ {
        # ---- 访问控制：防 LLM key 被白嫖（务必启用）----
        # 生成密码文件：sudo htpasswd -c /etc/nginx/lucky.htpasswd 用户名
        auth_basic "Lucky";
        auth_basic_user_file /etc/nginx/lucky.htpasswd;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";

        # SSE 关键三行：关缓冲 + 长超时，否则流式响应被攒包/掐断
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}

<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1560 1140" role="img" aria-labelledby="s3b-nodes-title s3b-nodes-desc" xmlns="http://www.w3.org/2000/svg" font-family="'Geist','Noto Sans SC',sans-serif">
  <title id="s3b-nodes-title">Lucky 2.0 三能力具体节点图</title>
  <desc id="s3b-nodes-desc">Lucky 2.0 LangGraph 节点级拓扑：用户问题经能力路由分发；dataquery 与 inventory 共用 14 节点问数链路（三路召回、过滤、SQL 生成、校验修正闭环、失败兜底、执行解释）；replenish 为固化算法单节点；default 为兜底对话；终点 END。</desc>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;family=Noto+Sans+SC:wght@400;500;600&amp;display=swap');
    .name { font-size: 12px; font-weight: 600; fill: #2d3142; text-anchor: middle; }
    .mono { font-size: 9px; fill: #4f5d75; text-anchor: middle; font-family: 'Geist Mono','Noto Sans SC',monospace; }
    .lbl  { font-size: 8px; fill: #7a8399; text-anchor: middle; font-family: 'Geist Mono','Noto Sans SC',monospace; letter-spacing: 0.06em; }
    .tag  { font-size: 7px; fill: rgba(45,49,66,0.8); text-anchor: middle; font-family: 'Geist Mono',monospace; letter-spacing: 0.08em; }
    .zone { font-size: 8px; fill: #4f5d75; font-family: 'Geist Mono','Noto Sans SC',monospace; letter-spacing: 0.12em; }
    .legend { font-size: 12px; fill: #4f5d75; }
  </style>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- ===== 子图容器（先画） ===== -->
  <rect x="448" y="88" width="704" height="880" rx="8" fill="#ececec" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
  <text class="zone" x="468" y="108">SHARED PIPELINE · 14 NODES · ENTRY: dataquery + inventory → extract_keywords</text>

  <!-- ===== 箭头（先于节点） ===== -->
  <path d="M184,592 H216" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M400,572 H448" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M308,528 V56 A8,8 0 0 1 316,48 H1344 A8,8 0 0 1 1352,56 V88" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M308,656 V1040 A8,8 0 0 0 316,1048 H1344 A8,8 0 0 0 1352,1040 V848" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M756,176 V192 A8,8 0 0 1 748,200 H590 A8,8 0 0 0 582,208 V224" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M800,176 V224" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M844,176 V192 A8,8 0 0 0 852,200 H1010 A8,8 0 0 1 1018,208 V224" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M582,280 V298 A8,8 0 0 0 590,306 H742 A8,8 0 0 1 750,314 V332" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M800,280 V332" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M1018,280 V298 A8,8 0 0 1 1010,306 H858 A8,8 0 0 0 850,314 V332" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M750,388 V412 A8,8 0 0 1 742,420 H704 A8,8 0 0 0 696,428 V440" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M850,388 V412 A8,8 0 0 0 858,420 H896 A8,8 0 0 1 904,428 V440" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M696,496 V520 A8,8 0 0 0 704,528 H742 A8,8 0 0 1 750,536 V548" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M904,496 V520 A8,8 0 0 1 896,528 H858 A8,8 0 0 0 850,536 V548" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M800,604 V656" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M800,712 V764" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M800,820 V872" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M900,780 H940" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M940,804 H900" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M1030,820 V872" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M700,900 H670" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M580,928 V1000" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- 箭头标签（带遮罩，6px+ 间距） -->
  <rect x="792" y="26" width="76" height="12" rx="2" fill="#f5f5f5"/>
  <text class="lbl" x="830" y="35">REPLENISH</text>
  <rect x="798" y="1026" width="64" height="12" rx="2" fill="#f5f5f5"/>
  <text class="lbl" x="830" y="1035">DEFAULT</text>
  <rect x="756" y="842" width="32" height="12" rx="2" fill="#ececec"/>
  <text class="lbl" x="772" y="851">OK</text>
  <rect x="903" y="762" width="34" height="12" rx="2" fill="#ececec"/>
  <text class="lbl" x="920" y="771">ERR</text>
  <rect x="903" y="786" width="34" height="12" rx="2" fill="#ececec"/>
  <text class="lbl" x="920" y="795">RETRY</text>
  <rect x="1040" y="842" width="88" height="12" rx="2" fill="#ececec"/>
  <text class="lbl" x="1084" y="851">MAX_RETRIES</text>

  <!-- ===== 节点 ===== -->

  <!-- 用户问题（输入） -->
  <rect x="40" y="560" width="144" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
  <rect x="48" y="566" width="40" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
  <text class="tag" x="68" y="575" fill="rgba(122,131,153,0.85)">INPUT</text>
  <text class="name" x="112" y="596">用户问题</text>
  <text class="mono" x="112" y="612">自然语言提问</text>

  <!-- 能力路由 -->
  <rect x="216" y="528" width="184" height="128" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="224" y="534" width="52" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
  <text class="tag" x="250" y="543">ROUTER</text>
  <text class="name" x="308" y="566">能力路由 · 五级递进</text>
  <text class="mono" x="308" y="586">route_capability</text>
  <text class="name" x="308" y="610" font-weight="400" fill="#4f5d75">芯片→规则→向量→LLM</text>
  <text class="mono" x="308" y="632">flags gate: inv / repl</text>

  <!-- 问数链路 14 节点 -->
  <rect x="712" y="120" width="176" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text class="name" x="800" y="144">关键词抽取</text>
  <text class="mono" x="800" y="162">extract_keywords</text>

  <rect x="490" y="224" width="184" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text class="name" x="582" y="248">字段召回</text>
  <text class="mono" x="582" y="266">recall_column</text>

  <rect x="708" y="224" width="184" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text class="name" x="800" y="248">取值召回</text>
  <text class="mono" x="800" y="266">recall_value</text>

  <rect x="926" y="224" width="184" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text class="name" x="1018" y="248">指标召回</text>
  <text class="mono" x="1018" y="266">recall_metric</text>

  <rect x="700" y="332" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text class="name" x="800" y="356">信息合并</text>
  <text class="mono" x="800" y="374">merge_retrieved_info</text>

  <rect x="604" y="440" width="184" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text class="name" x="696" y="464">表过滤</text>
  <text class="mono" x="696" y="482">filter_table</text>

  <rect x="812" y="440" width="184" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text class="name" x="904" y="464">指标过滤</text>
  <text class="mono" x="904" y="482">filter_metric</text>

  <rect x="700" y="548" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text class="name" x="800" y="572">补全上下文</text>
  <text class="mono" x="800" y="590">add_extra_context</text>

  <rect x="700" y="656" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text class="name" x="800" y="680">生成 SQL</text>
  <text class="mono" x="800" y="698">generate_sql</text>

  <rect x="700" y="764" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text class="name" x="800" y="788">校验 SQL</text>
  <text class="mono" x="800" y="806">validate_sql</text>

  <rect x="940" y="764" width="180" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text class="name" x="1030" y="788">修正 SQL</text>
  <text class="mono" x="1030" y="806">correct_sql</text>

  <rect x="940" y="872" width="180" height="56" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
  <text class="name" x="1030" y="896">失败兜底</text>
  <text class="mono" x="1030" y="914">fail</text>

  <rect x="700" y="872" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text class="name" x="800" y="896">执行 SQL</text>
  <text class="mono" x="800" y="914">run_sql</text>

  <rect x="490" y="872" width="180" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text class="name" x="580" y="896">结果解释</text>
  <text class="mono" x="580" y="914">explain_result</text>

  <!-- replenish（焦点：固化算法单节点） -->
  <rect x="1216" y="88" width="272" height="176" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
  <rect x="1224" y="94" width="108" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
  <text class="tag" x="1278" y="103" fill="rgba(235,108,54,0.85)">NODE · PIPELINE</text>
  <text class="name" x="1352" y="128">补货计划 replenish_plan</text>
  <text class="name" x="1352" y="154" font-weight="400">① 固定 SQL 取数（日均/快照/策略）</text>
  <text class="name" x="1352" y="178" font-weight="400">② 固化算法 · 纯 Python</text>
  <text class="name" x="1352" y="202" font-weight="400">③ LLM 只解释 · 不改数字</text>
  <text class="mono" x="1352" y="228">tests/test_replenish_algo.py · GWT 8/8</text>
  <text class="mono" x="1352" y="248">SSE: replenish + explanation</text>

  <!-- default（兜底） -->
  <rect x="1216" y="760" width="272" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="1224" y="766" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
  <text class="tag" x="1244" y="775">NODE</text>
  <text class="name" x="1352" y="798">兜底对话 default_answer</text>
  <text class="name" x="1352" y="824" font-weight="400" fill="#4f5d75">闲聊 · 使用帮助 · 引导回问数</text>

  <!-- END -->
  <rect x="548" y="1000" width="64" height="32" rx="16" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
  <text class="mono" x="580" y="1020" font-size="9">END</text>

  <!-- ===== 图例（底部横条） ===== -->
  <line x1="40" y1="1092" x2="1520" y2="1092" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text class="zone" x="40" y="1114">LEGEND</text>

  <rect x="120" y="1102" width="16" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="0.8"/>
  <text class="legend" x="144" y="1112">输入</text>

  <rect x="220" y="1102" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/>
  <text class="legend" x="244" y="1112">处理节点</text>

  <rect x="348" y="1102" width="16" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="0.8"/>
  <text class="legend" x="372" y="1112">设计焦点（replenish）</text>

  <rect x="540" y="1102" width="16" height="12" rx="2" fill="#ececec" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
  <text class="legend" x="564" y="1112">子图容器（dataquery + inventory 共用）</text>

  <rect x="880" y="1102" width="16" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
  <text class="legend" x="904" y="1112">终点</text>

  <line x1="980" y1="1108" x2="1012" y2="1108" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
  <text class="legend" x="1022" y="1112">失败路径</text>
</svg>

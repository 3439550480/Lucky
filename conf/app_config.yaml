logging:
  file:
    enable: true
    level: INFO
    path: logs
    rotation: "10 MB"
    retention: "7 days"
  console:
    enable: true
    level: INFO

db_meta:
  host: localhost
  port: 3307
  user: lzs
  password: Lzs666
  database: meta

db_dw:
  host: localhost
  port: 3307
  user: lzs
  password: Lzs666
  database: dw

qdrant:
  host: localhost
  port: 6333
  embedding_size: 512

embedding:
  host: localhost
  port: 8081
  model: BAAI/bge-small-zh-v1.5

es:
  host: localhost
  port: 9200
  index_name: data_agent         # [已废弃] 实际索引名 value_index 由 ValueESRepository 内部定义；此键未使用

llm:                          # [REWRITE] 单模型 → 多厂商 providers
  default: deepseek           # 请求未指定/非法 provider 时兜底
  providers:
    # 物理模型共 3 个；DeepSeek 峰谷是计费时段（按调用时间自动判定），不是用户选项
    deepseek:
      base_url: https://api.deepseek.com
      api_key: ${DEEPSEEK_API_KEY}
      model: deepseek-flash
      pricing:
        tiers:
          peak:    {input: 2.0, input_cache_hit: 0.04, output: 8.0}
          offpeak: {input: 1.0, input_cache_hit: 0.02, output: 4.0}
        tier_rules: beijing_workweek
    qwen:
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key: ${DASHSCOPE_API_KEY}
      model: qwen3.8-flash
      pricing:
        tiers:
          standard: {input: 0.8, input_cache_hit: 0.1, output: 2.7}
    glm:
      base_url: https://open.bigmodel.cn/api/paas/v4
      api_key: ${ZHIPU_API_KEY}
      model: glm-5.3-flash
      pricing:
        tiers:
          standard: {input: 0.8, input_cache_hit: 0.23, output: 2.8}


sql:
  max_retries: 2   # SQL 校验失败后的最大重试次数

features:                     # [NEW] 模块开关（定义见 docs/design/00 §3）
  usage_tracking: true
  capability_routing: true
  rules_fast_path: true
  embedding_route: true
  capability_chip: true
  context_management: true
  memory:
    short_term: true
    long_term: false
  evaluation:
    retrieval_metrics: true
    intent_metrics: true
    sql_metrics: true
    cost_metrics: true
    tool_metrics: true
    memory_metrics: true

session:                      # [NEW] 上下文管理（05 文档 §2.1）
  history_max_turns: 10
  history_max_tokens: 4000
  summary_trigger_turns: 20
  summary_keep_recent_turns: 5

memory:                       # [NEW] 记忆管理（06 文档 §2.1）
  store_backend: json_file
  store_path: data/memory
  extract_after_run: true
  extraction_provider: deepseek
  retrieval_top_k: 5
  similarity_threshold: 0.60    # bge-small-zh 校准：相关非改写短文本对典型 0.6~0.8，
                                # 0.80 会漏掉"会员号是多少 vs 会员号是123456"类回忆对（实测 0.7535）
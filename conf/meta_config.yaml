# ============================================================
# 元数据知识库配置 —— 连锁奶茶店数据集（v1.1 FR-06 重写）
# [规则3 留档] 旧版（电商 5 表 + 10 指标）已随数据集替换整体废弃，
# 历史版本见 git（commit e39d96d 之前）。
# 字段语义与 docker/mysql/dw.sql（由 generate_milktea_data.py 生成）逐字对应。
# ============================================================

tables:
  - name: dim_store
    role: dim
    description: 门店维度表。一行 = 一家门店。store_type 是门店商圈类型（办公区/社区/商场）——注意：办公区门店的销量模式与社区/商场相反（工作日高、周末低），按"周末 vs 工作日"分析时不要跨类型混合解读。部分门店 2025 年内开业（open_date 晚），存在爬坡期，"哪家门店销量最高"类问题应结合 open_date 解读。
    columns:
      - name: store_id
        role: primary_key
        description: 门店唯一标识。
        alias: [门店ID]
        sync: false
      - name: store_name
        role: dimension
        description: 门店名称（含商圈特征，如"国贸写字楼店"）。
        alias: [门店名称, 门店, 店名]
        sync: true
      - name: city
        role: dimension
        description: 门店所在城市（北京/上海/广州/深圳/成都/重庆/杭州）。
        alias: [城市, 所在城市]
        sync: true
      - name: store_type
        role: dimension
        description: 门店商圈类型：办公区（工作日高、周末显著低）、社区、商场（周末高于工作日）。"周末销量比工作日高吗"类问题的答案取决于此列，必须按类型分别统计。
        alias: [门店类型, 商圈类型, 店型]
        sync: true
      - name: open_date
        role: dimension
        description: 门店开业日期。2025 年内开业的门店（科技园店/来福士店/解放碑社区店）前 8 周处于爬坡期，销量天然偏低。
        alias: [开业日期, 开业时间]
        sync: true
      - name: staff_count
        role: dimension
        description: 门店员工人数（门店规模参考，非销量直接决定因素）。
        alias: [员工人数, 店员数量]
        sync: false

  - name: dim_product
    role: dim
    description: 产品维度表。一行 = 一款在售饮品。注意 rating（评分）与销量无必然关系——评分最高的产品可能销量垫底（"叫好不叫座"）。is_cobrand=是 的联名款均为 2025 年上市的新品。
    columns:
      - name: product_id
        role: primary_key
        description: 产品唯一标识。
        alias: [产品ID, 商品ID]
        sync: false
      - name: product_name
        role: dimension
        description: 产品名称。
        alias: [产品名称, 商品名称, 饮品名称, 奶茶名]
        sync: true
      - name: category
        role: dimension
        description: 产品品类：经典奶茶/果茶/咖啡/联名款。
        alias: [品类, 产品类别, 分类]
        sync: true
      - name: unit_price
        role: measure
        description: 单杯标价（元）。订单金额 = unit_price × order_quantity。
        alias: [单价, 价格, 标价]
        sync: false
      - name: rating
        role: measure
        description: 平台评分（0~5，一位小数）。评分与销量无相关性——存在评分最高但销量垫底的产品。
        alias: [评分, 得分, 口碑分]
        sync: false
      - name: launch_date
        role: dimension
        description: 产品上市日期。用于区分经典款（2025 年前上市）与新品/联名款。
        alias: [上市日期, 上市时间, 上架时间]
        sync: false
      - name: is_cobrand
        role: dimension
        description: 是否联名款（是/否）。联名款 2025-06 起陆续上市，上市后抢走的是同期其它新品（果茶/咖啡类 2025 新品）的销量，经典款基本盘稳定。
        alias: [是否联名, 联名款, 联名]
        sync: true

  - name: dim_date
    role: dim
    description: 日期维度表，一行 = 一天（2025 全年 365 天）。is_weekend（是/否）直接支撑"周末 vs 工作日"分析；跨表统计日期相关问题时经 date_id 关联。
    columns:
      - name: date_id
        role: primary_key
        description: 日期唯一标识，格式 yyyyMMdd。
        alias: [日期ID, 日期]
        sync: false
      - name: year
        role: dimension
        description: 年份（2025）。
        alias: [年, 年份]
        sync: false
      - name: quarter
        role: dimension
        description: 季度（Q1~Q4）。
        alias: [季度]
        sync: true
      - name: month
        role: dimension
        description: 月份（1~12）。
        alias: [月, 月份]
        sync: false
      - name: day
        role: dimension
        description: 日（1~31）。
        alias: [日, 天]
        sync: false
      - name: weekday
        role: dimension
        description: 星期几（星期一~星期日）。
        alias: [星期, 周几, 星期几]
        sync: true
      - name: is_weekend
        role: dimension
        description: 是否周末（是/否）。"周末 vs 工作日"问题优先用此列分组；结论必须结合门店类型解读（办公区门店周末反而最低）。
        alias: [是否周末, 周末]
        sync: true

  - name: dim_member
    role: dim
    description: 会员维度表。一行 = 一位注册会员。注意：fact_orders 中 member_id 为 NULL 的订单是非会员匿名下单——"会员 vs 非会员"对比时，非会员不是 member_level 的某个取值，而是 member_id IS NULL。
    columns:
      - name: member_id
        role: primary_key
        description: 会员唯一标识。注意与 fact_orders.member_id 关联；NULL 语义见 fact_orders 表说明。
        alias: [会员ID]
        sync: false
      - name: member_name
        role: dimension
        description: 会员昵称（脱敏展示）。
        alias: [会员名称, 会员昵称]
        sync: true
      - name: member_level
        role: dimension
        description: 会员等级：普通/白银/黄金。
        alias: [会员等级, 等级]
        sync: true
      - name: register_date
        role: dimension
        description: 会员注册日期（多数为 2024 年老会员）。
        alias: [注册日期, 注册时间]
        sync: false

  - name: fact_orders
    role: fact
    description: 订单事实表，一行 = 一笔饮品销售小票。member_id 为 NULL 表示非会员匿名下单（"会员 vs 非会员"对比的关键：非会员 = member_id IS NULL，而不是某个等级）。channel 区分堂食/外卖。订单金额 = 产品单价 × 数量。
    columns:
      - name: order_id
        role: primary_key
        description: 订单唯一标识。
        alias: [订单ID, 小票号]
        sync: false
      - name: store_id
        role: foreign_key
        description: 关联门店维度的外键。
        alias: [门店ID]
        sync: false
      - name: product_id
        role: foreign_key
        description: 关联产品维度的外键。
        alias: [产品ID, 商品ID]
        sync: false
      - name: date_id
        role: foreign_key
        description: 关联日期维度的外键（yyyyMMdd）。
        alias: [日期, 下单日期, 销售日期]
        sync: false
      - name: member_id
        role: foreign_key
        description: 关联会员维度的外键；【可空】NULL = 非会员匿名下单。统计"非会员"指标时必须用 member_id IS NULL，不能 JOIN dim_member（会漏掉全部非会员订单）。
        alias: [会员ID]
        sync: false
      - name: channel
        role: dimension
        description: 下单渠道：堂食/外卖。
        alias: [渠道, 下单渠道, 堂食外卖]
        sync: true
      - name: order_quantity
        role: measure
        description: 本单饮品杯数。
        alias: [销量, 杯数, 数量, 购买数量]
        sync: false
      - name: order_amount
        role: measure
        description: 订单实收金额（元）。
        alias: [销售额, 订单金额, 营业额, 收入]
        sync: false

metrics:
  - name: GMV
    description: 指定范围内所有订单的实收金额总和（元）。
    relevant_columns:
      - fact_orders.order_amount
    alias: [营业额, 销售额, 订单总额, 成交总额]
  - name: AOV
    description: 客单价，所有订单实收金额的平均值（元/单）。
    relevant_columns:
      - fact_orders.order_amount
    alias: [平均订单金额, 客单价, 平均单价]
  - name: Total Orders
    description: 指定范围内的订单总数量（单）。
    relevant_columns:
      - fact_orders.order_id
    alias: [订单量, 订单数, 总订单数]
  - name: Sales Volume
    description: 指定范围内售出的饮品杯数总和（杯）。
    relevant_columns:
      - fact_orders.order_quantity
    alias: [销量, 销售杯数, 卖出杯数]
  - name: Member Penetration Rate
    description: 会员订单占比 = 会员下单量 ÷ 总下单量（非会员为 member_id IS NULL 的订单）。
    relevant_columns:
      - fact_orders.member_id
    alias: [会员占比, 会员渗透率, 会员下单占比]
  - name: Repeat Purchase Rate
    description: 复购率 = 下单 ≥2 次的去重会员数 ÷ 总去重会员数。
    relevant_columns:
      - fact_orders.member_id
    alias: [复购率, 重复购买率]
  - name: Average Items Per Order
    description: 连带率 = 杯数总和 ÷ 订单数（平均每单几杯）。
    relevant_columns:
      - fact_orders.order_quantity
    alias: [连带率, 客件数, 平均每单杯数]

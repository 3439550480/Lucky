# ============================================================
# 元数据知识库配置 —— 安踏特卖店数据集（2.0 S3b 重写）
# [规则3 留档] 旧版（奶茶店 5 表 + 7 指标）已随数据集替换整体废弃，历史见 git。
# 字段语义与 docker/mysql/dw.sql（generate_anta_data.py 生成）逐字对应。
#
# 设计要点（S3b 拍板）：inventory 能力复用问数链路、零新增节点——其领域化载体
# 就是本文件：快照 as-of 口径、流水正负号、断码定义、折扣预计算等库存语义
# 全部沉淀在字段描述里，召回与 SQL 生成自然"懂"库存。
# 注意：dim_staff 不入元数据（含凭据哈希，属门店操作台域，非 Text2SQL 域）。
# ============================================================

tables:
  - name: dim_product
    role: dim
    description: 商品维度表。一行 = 一个货号（SPU）。特卖店核心语义：prod_year（生产年份）决定账龄档 → 基准折扣；sale_attr 是特卖属性（断码清仓/过季商品/特卖专供款/正价转特卖）。折扣"结果"在 fact_sales.final_rate（已预计算），本表只描述商品静态属性。
    columns:
      - name: product_id
        role: primary_key
        description: 货号，8 位（位1尺码容别/位2男女/位3-4年份/位5季节/位6-7序号/位8校验）。
        alias: [货号, 商品ID, 款号]
        sync: false
      - name: product_name
        role: dimension
        description: 商品名称。
        alias: [商品名称, 商品名, 款式名称]
        sync: true
      - name: category_l1
        role: dimension
        description: 一级品类：鞋类/服装类/配件类。补货策略（覆盖天数）与库存分析常按此分组。
        alias: [品类, 一级品类, 大类]
        sync: true
      - name: category_l2
        role: dimension
        description: 二级品类（跑鞋/篮球鞋/休闲鞋&板鞋/T恤/卫衣/配件等，约 16 类）。
        alias: [二级品类, 小类, 品类细分]
        sync: true
      - name: gender
        role: dimension
        description: 适用人群：男/女/儿童·大童/儿童·小童/男女同款。
        alias: [性别, 适用人群, 男女款]
        sync: true
      - name: series
        role: dimension
        description: 产品系列：跑步/篮球/综训/生活/潮流/冠军/足球。
        alias: [系列, 产品系列]
        sync: true
      - name: season
        role: dimension
        description: 生产季节（货号位5）：春/夏/秋/冬。26 夏=当季新款（折扣规则见 dim_pricing_rule）。
        alias: [季节, 生产季节]
        sync: true
      - name: prod_year
        role: dimension
        description: 生产年份（货号位3-4）：24/25/26。账龄档依据——年份越老基准折扣越深（24 老货清仓、26 当季浅折）。
        alias: [生产年份, 年份, 账龄]
        sync: false
      - name: sale_attr
        role: dimension
        description: 特卖属性：断码清仓/过季商品/特卖专供款/正价转特卖。注意"断码清仓"是清仓策略属性，不等于该 SKU 真的断码——库存是否断码看 dim_inventory_snapshot.available_qty。
        alias: [特卖属性, 销售属性, 属性]
        sync: true
      - name: list_price
        role: measure
        description: 吊牌价（元）。实付金额 = 吊牌价 × 数量 × 最终折扣率（已在 fact_sales 逐行落库）。
        alias: [吊牌价, 原价, 标价]
        sync: false

  - name: dim_sku
    role: dim
    description: SKU 维度表。一行 = 货号-色-码 的一个销售单元。库存快照与出入库流水均按 sku_id 粒度记录——查"某商品还剩几件"经 sku_id 关联 dim_inventory_snapshot。
    columns:
      - name: sku_id
        role: primary_key
        description: SKU 编码，格式 货号-色号-尺码（如 15262019-01-42）。库存快照与出入库流水的外键粒度。
        alias: [SKU, SKU编码, SKU编号]
        sync: true
      - name: product_id
        role: foreign_key
        description: 关联商品维度（货号）。SKU:货号 = 多:1。
        alias: [货号]
        sync: false
      - name: color
        role: dimension
        description: 颜色名。
        alias: [颜色, 色码, 配色]
        sync: true
      - name: barcode
        role: dimension
        description: EAN 条码（仿真）。收银/盘点场景按条码定位 SKU。
        alias: [条码, 条形码, 条码号]
        sync: true

  - name: dim_date
    role: dim
    description: 日期维度表。数据集仅覆盖 2026-10-01 ~ 2026-10-07（国庆 7 天，is_holiday 全为"是"）——"同比/环比/上个月"类跨期问题超出数据范围，应说明数据只有这 7 天并在范围内作答。
    columns:
      - name: date_id
        role: primary_key
        description: 日期唯一标识 yyyyMMdd（20261001~20261007）。
        alias: [日期ID, 日期]
        sync: false
      - name: year
        role: dimension
        description: 年份（2026）。
        alias: [年, 年份]
        sync: false
      - name: quarter
        role: dimension
        description: 季度（Q4）。
        alias: [季度]
        sync: true
      - name: month
        role: dimension
        description: 月份（10）。
        alias: [月, 月份]
        sync: false
      - name: day
        role: dimension
        description: 日（1~7）。
        alias: [日, 天]
        sync: false
      - name: weekday
        role: dimension
        description: 星期几。
        alias: [星期, 周几, 星期几]
        sync: true
      - name: is_weekend
        role: dimension
        description: 是否周末（是/否）。
        alias: [是否周末, 周末]
        sync: true
      - name: is_holiday
        role: dimension
        description: 是否法定节假日（是/否）。本数据集 7 天全部为"是"（国庆档）。
        alias: [是否节假日, 节假日]
        sync: true

  - name: dim_pricing_rule
    role: dim
    description: 折扣参数表。两类规则：base_discount（按 prod_year 账龄档的基准折扣率）与 full_price_threshold（满件加折门槛）。fact_sales 的 base_rate/final_rate 已按本表预计算——查"实际卖了什么折扣/实收多少"用 fact_sales，查"折扣规则是什么"用本表，禁止在 SQL 里重算折扣（满件加折依赖整单总件数，跨行逻辑易错）。
    columns:
      - name: rule_id
        role: primary_key
        description: 规则ID。
        alias: [规则ID]
        sync: false
      - name: rule_type
        role: dimension
        description: 规则类型：base_discount=账龄基准折扣 / full_price_threshold=满件门槛。
        alias: [规则类型, 折扣类型]
        sync: true
      - name: year_code
        role: dimension
        description: 账龄档（生产年份位 24/25/26），base_discount 规则的适用档位。
        alias: [年份位, 账龄档]
        sync: true
      - name: season_code
        role: dimension
        description: 季节档（26 夏=新款档）。
        alias: [季节]
        sync: true
      - name: base_rate
        role: measure
        description: 基准折扣率（售价/吊牌价，0.70 即 7 折）。
        alias: [基准折扣, 基准折扣率]
        sync: false
      - name: threshold_qty
        role: measure
        description: 满件门槛（件）——整单件数未达门槛时，每缺 1 件加折 add_per_unit。
        alias: [满件门槛, 门槛件数]
        sync: false
      - name: add_per_unit
        role: measure
        description: 每缺 1 件的加折幅度（如 0.10）。
        alias: [加折幅度]
        sync: false
      - name: cap_rate
        role: measure
        description: 折扣率上限（1.0 = 原价封顶）。
        alias: [折扣上限, 封顶折扣]
        sync: false

  - name: fact_sales
    role: fact
    description: 销售事实表，一行 = 订单中的一行商品。折扣已预计算（base_rate→final_rate），actual_amount = list_price × quantity × final_rate，聚合即可。member_level 为 NULL = 非会员（is_member=0）。满件折扣判定依据是 order_total_qty（跨行冗余字段，已在每行落库）。
    columns:
      - name: sale_id
        role: primary_key
        description: 销售行唯一标识。
        alias: [销售ID]
        sync: false
      - name: order_id
        role: foreign_key
        description: 订单号。同 order_id 的多行 = 一单多款。
        alias: [订单号, 订单ID, 小票号]
        sync: false
      - name: line_no
        role: dimension
        description: 订单内行号。
        alias: [行号]
        sync: false
      - name: date_id
        role: foreign_key
        description: 销售日期（yyyyMMdd，20261001~20261007）。
        alias: [日期, 销售日期]
        sync: false
      - name: sku_id
        role: foreign_key
        description: SKU 编码，关联 dim_sku（进而关联 dim_product 取品类/系列等属性）。
        alias: [SKU, SKU编码]
        sync: false
      - name: quantity
        role: measure
        description: 本行销售件数。销量 = SUM(quantity)。
        alias: [销量, 件数, 数量, 卖出件数]
        sync: false
      - name: list_price
        role: measure
        description: 行吊牌价（元）。
        alias: [吊牌价, 原价]
        sync: false
      - name: base_rate
        role: measure
        description: 基准折扣率（按账龄档判定，已落库）。
        alias: [基准折扣率]
        sync: false
      - name: order_total_qty
        role: measure
        description: 整单总件数（跨行冗余字段）——满件折扣判定依据。按"单"分析件数分布用它，不要 SUM(quantity)。
        alias: [整单件数, 订单总件数]
        sync: false
      - name: final_rate
        role: measure
        description: 最终折扣率 = 基准 + 缺口加折，上限 1.0。平均折扣 = AVG(final_rate)。
        alias: [最终折扣率, 折扣率, 实际折扣]
        sync: false
      - name: actual_amount
        role: measure
        description: 实付金额（元）= list_price × quantity × final_rate。销售额/GMV = SUM(actual_amount)。
        alias: [实付金额, 销售额, 金额, 实收金额]
        sync: false
      - name: is_member
        role: dimension
        description: 是否会员（1/0）。
        alias: [是否会员, 会员]
        sync: false
      - name: member_level
        role: dimension
        description: 会员等级：金卡/银卡/普通；【可空】NULL = 非会员（与 is_member=0 对应）。
        alias: [会员等级, 等级]
        sync: true

  - name: dim_inventory_snapshot
    role: fact
    description: 库存日末快照表，一行 = 某天某 SKU 的日末库存。关键口径："现在/当前库存" = snapshot_date 等于最新快照日（SELECT MAX(snapshot_date)）的行——不要用今天的日历日期（数据只到 2026-10-07）。断码 = 最新快照日 available_qty = 0（SKU = 颜色×尺码粒度）。
    columns:
      - name: snap_id
        role: primary_key
        description: 快照行标识。
        alias: [快照ID]
        sync: false
      - name: snapshot_date
        role: dimension
        description: 快照日期（yyyyMMdd，20261001~20261007 每日末）。"当前库存"必须取 MAX(snapshot_date)；超出范围的日历日期查不到数据。
        alias: [快照日期, 快照日, 盘点日期]
        sync: false
      - name: sku_id
        role: foreign_key
        description: SKU 编码。
        alias: [SKU, SKU编码]
        sync: false
      - name: book_qty
        role: measure
        description: 账面库存（件）。
        alias: [账面库存, 账面数]
        sync: false
      - name: available_qty
        role: measure
        description: 可用库存（件）——可售口径。当前库存/断码/覆盖天数均以此为准；= 0 即断码。
        alias: [可用库存, 当前库存, 现有库存, 库存]
        sync: false

  - name: fact_inventory_flow
    role: fact
    description: 出入库流水表，一行 = 一次库存动作。quantity 正=入库、负=出库；净变化 = SUM(quantity)；分类统计用 flow_type。operator_id 为 NULL 表示系统自动（POS 销售出库），人工单据（补货/报损/退货）都有工号。
    columns:
      - name: flow_id
        role: primary_key
        description: 流水唯一标识。
        alias: [流水ID]
        sync: false
      - name: doc_no
        role: dimension
        description: 单据号，前缀区分业务：RK=补货 / XS=销售出库 / TH=退货 / BS=报损。
        alias: [单据号, 单号]
        sync: true
      - name: flow_type
        role: dimension
        description: 流水类型：补货入库-早班 / 补货入库-晚班 / 销售出库 / 退货入库 / 报损出库。
        alias: [流水类型, 出入库类型, 类型]
        sync: true
      - name: sku_id
        role: foreign_key
        description: SKU 编码。
        alias: [SKU, SKU编码]
        sync: false
      - name: quantity
        role: measure
        description: 数量（件）：正=入库，负=出库。入库量对正数 SUM，出库量对负数 SUM 后取绝对值。
        alias: [数量, 出入库数量, 件数]
        sync: false
      - name: date_id
        role: foreign_key
        description: 业务日期（yyyyMMdd）。
        alias: [日期, 业务日期]
        sync: false
      - name: operator_id
        role: dimension
        description: 经办人工号；【可空】NULL = 系统自动（POS 销售出库）。
        alias: [经办人工号, 经办人ID]
        sync: true
      - name: idempotency_key
        role: dimension
        description: 幂等键（单据号:SKU:操作类型），防重复记账——同一单据重复导入不会重复加减库存。
        alias: [幂等键]
        sync: false
      - name: operator
        role: dimension
        description: 经办人姓名（展示用）。
        alias: [经办人, 操作人]
        sync: true

  - name: dim_replenish_policy
    role: dim
    description: 补货策略参数表（scope=store 为门店策略，warehouse 为仓库预留）。coverage_days 目标覆盖天数：鞋 7 / 服装 3 / 配件 14；safety_days 安全库存天数（3）。补货计划的固化算法（replenish 能力）读本表取参：建议量 = max(0, 日均销量×(覆盖天数+安全天数) − 可用库存 − 在途)。
    columns:
      - name: policy_id
        role: primary_key
        description: 策略ID。
        alias: [策略ID]
        sync: false
      - name: scope
        role: dimension
        description: 策略范围：store=门店（本期生效）/ warehouse=仓库（预留，暂不生效）。
        alias: [范围, 策略范围]
        sync: true
      - name: category
        role: dimension
        description: 品类：鞋类/服装类/配件类（与 dim_product.category_l1 对应）。
        alias: [品类]
        sync: true
      - name: coverage_days
        role: measure
        description: 目标覆盖天数：鞋类 7 / 服装类 3 / 配件类 14。
        alias: [覆盖天数, 目标覆盖天数]
        sync: false
      - name: safety_days
        role: measure
        description: 安全库存天数（3）。
        alias: [安全天数, 安全库存天数]
        sync: false
      - name: moq
        role: measure
        description: 最小起订量；门店行 NULL=不设，仓库行有值（预留）。
        alias: [最小起订量, 起订量]
        sync: false
      - name: note
        role: dimension
        description: 策略备注。
        alias: [备注]
        sync: false

metrics:
  - name: 销售额
    description: 指定范围内实付金额总和（元）= SUM(fact_sales.actual_amount)。
    relevant_columns:
      - fact_sales.actual_amount
    alias: [GMV, 营业额, 实收金额, 销售金额]
  - name: 销量
    description: 指定范围内售出件数总和 = SUM(fact_sales.quantity)。
    relevant_columns:
      - fact_sales.quantity
    alias: [销售件数, 卖出件数, 件数]
  - name: 吊牌金额
    description: 按吊牌价计的金额 = SUM(list_price × quantity)（未打折口径）。
    relevant_columns:
      - fact_sales.list_price
      - fact_sales.quantity
    alias: [吊牌价金额, 原价金额, 标价金额]
  - name: 平均折扣率
    description: 实际成交折扣 = AVG(fact_sales.final_rate)（已预计算，勿在 SQL 重算）。
    relevant_columns:
      - fact_sales.final_rate
    alias: [折扣率, 实际折扣, 平均折扣]
  - name: 动销率
    description: 动销率 = 有销量的 SKU 数 ÷ 在售 SKU 总数（SKU 级售卖广度）。
    relevant_columns:
      - fact_sales.sku_id
      - dim_sku.sku_id
    alias: [售卖率, 售卖广度]
  - name: 可用库存
    description: 当前可用库存（件），取最新快照日的 available_qty——"当前"= MAX(dim_inventory_snapshot.snapshot_date)，不是日历今天。
    relevant_columns:
      - dim_inventory_snapshot.available_qty
      - dim_inventory_snapshot.snapshot_date
    alias: [当前库存, 现有库存, 库存量, 库存]
  - name: 断码SKU数
    description: 最新快照日 available_qty = 0 的 SKU 数量（按颜色×尺码粒度算断码）。
    relevant_columns:
      - dim_inventory_snapshot.available_qty
      - dim_inventory_snapshot.snapshot_date
    alias: [断码数, 断码, 缺货SKU数]
  - name: 库存覆盖天数
    description: 库存可支撑销售的天数 = 最新快照可用库存 ÷ 近 7 天日均销量（按 SKU）。
    relevant_columns:
      - dim_inventory_snapshot.available_qty
      - fact_sales.quantity
      - fact_sales.sku_id
    alias: [覆盖天数, 可卖天数, 够卖几天]
